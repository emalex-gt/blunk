name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm production deployment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: inputs.confirm_production == true
    runs-on: ubuntu-latest
    environment: production
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_PORT: ${{ secrets.PROD_PORT }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_PATH: ${{ secrets.PROD_PATH }}

    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for secret_name in PROD_HOST PROD_USER PROD_PORT PROD_SSH_KEY PROD_PATH; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required GitHub secret: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          # Verify its fingerprint before the first deployment as documented below.
          ssh-keyscan -p "$PROD_PORT" -H "$PROD_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy over SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          prod_path_base64="$(printf '%s' "$PROD_PATH" | base64 --wrap=0)"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$PROD_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${PROD_USER}@${PROD_HOST}" \
            "PROD_PATH_BASE64=${prod_path_base64} bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          PROD_PATH="$(printf '%s' "$PROD_PATH_BASE64" | base64 --decode)"
          maintenance_enabled=false

          restore_application() {
            exit_code=$?
            if [[ "$maintenance_enabled" == true ]]; then
              echo "Restoring application availability after deploy exit code ${exit_code}."
              php8.5 artisan up || echo "WARNING: php8.5 artisan up failed; restore it manually immediately." >&2
            fi
            exit "$exit_code"
          }

          trap restore_application EXIT
          cd "$PROD_PATH"

          php8.5 -v
          php8.5 -m | grep -i pgsql

          current_branch="$(git branch --show-current)"
          echo "Current branch: ${current_branch}"
          echo "Last commit before deploy: $(git log -1 --oneline)"
          git status --short

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Refusing to deploy: ${PROD_PATH} has local changes." >&2
            exit 1
          fi

          if [[ "$current_branch" != "main" ]]; then
            echo "Refusing to deploy: ${PROD_PATH} is not on main." >&2
            exit 1
          fi

          git pull origin main
          echo "Last commit after deploy: $(git log -1 --oneline)"

          composer install --no-dev --optimize-autoloader
          npm ci
          npm run build

          php8.5 artisan down
          maintenance_enabled=true

          php8.5 artisan migrate --force
          php8.5 artisan db:seed --class=PermissionSeeder --force
          php8.5 artisan db:seed --class=GuatemalaLocationSeeder --force
          php8.5 artisan optimize:clear
          php8.5 artisan config:cache
          php8.5 artisan route:cache
          php8.5 artisan queue:restart

          php8.5 artisan up
          maintenance_enabled=false
          REMOTE_SCRIPT
